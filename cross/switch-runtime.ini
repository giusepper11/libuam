# Pinned devkitA64/libnx toolchain used by the Dawn consumer.
[binaries]
c = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc'
cpp = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++'
ar = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc-ar'
strip = '/opt/devkitpro/devkitA64/bin/aarch64-none-elf-strip'

[host_machine]
system = 'horizon'
cpu_family = 'aarch64'
cpu = 'cortex-a57'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-I/opt/devkitpro/libnx/include', '-D__SWITCH__=1', '-D_DEFAULT_SOURCE']
cpp_args = ['-march=armv8-a+crc+crypto', '-mtune=cortex-a57', '-mtp=soft', '-fPIE', '-I/opt/devkitpro/libnx/include', '-D__SWITCH__=1', '-D_DEFAULT_SOURCE']
c_link_args = ['-specs=/opt/devkitpro/libnx/switch.specs', '-L/opt/devkitpro/libnx/lib', '-lnx']
cpp_link_args = ['-specs=/opt/devkitpro/libnx/switch.specs', '-L/opt/devkitpro/libnx/lib', '-lnx']
